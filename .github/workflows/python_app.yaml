name: Python CI

on:
  push:
    branches: python_project
  pull_request:
    branches: python_project

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6.0.2
      - name: setup python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          mkdir -p reports/
          PYTHONPATH=. pytest -v
          pytest --junitxml=reports/unit-test-results.xml --cov=. --cov-report=xml --cov-report=term-mssing -v
      - name: upload report
        uses: actions/upload-artifact@v7.0.0
        with:
          name: unit-test-report
          path: reports/
        

    
